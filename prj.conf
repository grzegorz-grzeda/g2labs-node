CONFIG_LOG=y

# UART shell
CONFIG_SHELL=y

# Image adapter: confirm the running MCUboot image
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y

# Settings: Known Networks in the storage partition
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Wi-Fi station with DHCP
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_DHCPV4=y
# The Wi-Fi adapter runs DHCP itself, so association and getting an IP
# address reach the core as separate events.
CONFIG_WIFI_STA_AUTO_DHCPV4=n
CONFIG_NET_TCP=y
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_ESP32_WIFI_ENABLE_WPA3_SAE=y

# Broker: MQTT 3.1.1 over plain TCP. Host names resolve via DHCP's DNS
# server, and .local names via mDNS (the resolver joins the mDNS group).
CONFIG_NET_SOCKETS=y
CONFIG_DNS_RESOLVER=y
CONFIG_MDNS_RESOLVER=y
# The resolver adds the mDNS group only with static servers enabled; none
# are set, so unicast DNS still comes from DHCP alone.
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_NET_IPV4_IGMP=y
CONFIG_MQTT_LIB=y

# Reboot command
CONFIG_REBOOT=y

# Free memory in status: runtime stats of every sys_heap
CONFIG_SYS_HEAP_RUNTIME_STATS=y
CONFIG_SYS_HEAP_ARRAY_SIZE=4

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096

# Remote management: SMP over UDP port 1337 on every interface, listening
# from the moment the Node has an IP address. Unauthenticated until the
# security work (docs/management.md).
CONFIG_NET_UDP=y
CONFIG_MCUMGR=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_NET_BUF=y
CONFIG_MCUMGR_TRANSPORT_UDP=y
# One more connection and socket than before: DHCP, the DNS and mDNS
# resolver sockets, MQTT and now SMP. At the default of 4 connections the
# resolver lost its mDNS socket and .local Brokers stopped resolving.
CONFIG_NET_MAX_CONN=6
CONFIG_NET_MAX_CONTEXTS=8
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=4096
# Image management: upload to the secondary slot, test, confirm, list
CONFIG_MCUMGR_GRP_IMG=y
# OS management: echo, reset, buffer parameters and bootloader info for
# host tools that size their uploads from them
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_MCUMGR_PARAMS=y
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=y
# Shell management: run `node …` commands over SMP. No devmem: it would
# read any memory, passwords included, for anyone on the network.
CONFIG_DEVMEM_SHELL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1024
CONFIG_MCUMGR_GRP_SHELL=y
# Settings management, through the settings adapter's "node" handler. The
# access hook refuses password reads and deletes under node/.
CONFIG_SETTINGS_RUNTIME=y
CONFIG_MCUMGR_GRP_SETTINGS=y
CONFIG_MCUMGR_GRP_SETTINGS_NAME_LEN=32
CONFIG_MCUMGR_GRP_SETTINGS_VALUE_LEN=65
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_SETTINGS_ACCESS_HOOK=y
